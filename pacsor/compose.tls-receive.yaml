services:
  storescp:
    ports:
      - "${TLS_PORT:-2762}:2762"
    environment:
      ENABLE_TLS: "true"
      ENABLE_PLAIN_DICOM: ${ENABLE_PLAIN_DICOM:-true}
    volumes:
      - type: bind
        source: "../conf/tls"
        target: /certs
        read_only: true
    healthcheck:
      test: [ "CMD-SHELL", "{ [ \"$$ENABLE_PLAIN_DICOM\" = false ] || echoscu storescp 1040; } && grep -q ':0ACA [0-9A-F]*:0000 0A ' /proc/net/tcp /proc/net/tcp6" ]
